<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#047857" />
    <meta name="application-name" content="DBC" />
    <meta name="apple-mobile-web-app-title" content="DBC" />
    <title>DBC | Design Build Connect</title>
    <script>
      // Automatic recovery for stale ServiceWorker / 404 bundle cache locks
      window.addEventListener('error', function (e) {
        var target = e.target;
        if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
          var isChunkError = target.src || target.href;
          if (isChunkError && !sessionStorage.getItem('dbc_stale_reload')) {
            sessionStorage.setItem('dbc_stale_reload', 'true');
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                for (var i = 0; i < regs.length; i++) regs[i].unregister();
              });
            }
            if ('caches' in window) {
              caches.keys().then(function(keys) {
                for (var i = 0; i < keys.length; i++) caches.delete(keys[i]);
              });
            }
            window.location.reload(true);
          }
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
