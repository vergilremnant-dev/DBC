    <script>
      // Automatic recovery for stale ServiceWorker / 404 bundle cache locks
      window.addEventListener('error', function (e) {
        var target = e.target;
        if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
          var isChunkError = target.src || target.href;
          if (isChunkError && !sessionStorage.getItem('dbc_stale_reload')) {
            sessionStorage.setItem('dbc_stale_reload', 'true');
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                for (var i = 0; i < regs.length; i++) regs[i].unregister();
              });
            }
            if ('caches' in window) {
              caches.keys().then(function(keys) {
                for (var i = 0; i < keys.length; i++) caches.delete(keys[i]);
              });
            }
            window.location.reload(true);
          }
        }
      }, true);
    </script>
